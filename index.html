<script>

// =========================
// ✅ CONVERSION
// =========================
const conv = {
280:11.2,300:12.4,320:13.6,340:13.6,
360:14.9,380:14.9,400:15.5,420:16.9,
460:18.4,480:18.4,520:20.8
};

function mmToConv(mm){
 return conv[Math.round(mm)] || (mm/25.4);
}

// =========================
// ✅ NORMALIZE COMPLET
// =========================
function normalize(val){

 val = val.toLowerCase().replace(/\s+/g,'');

 let m = val.match(/(\d+)\/\d+r(\d+(\.\d+)?)/);
 if(m) return mmToConv(m[1]).toFixed(1)+"-"+m[2];

 let r = val.match(/(\d+\.?\d*)r(\d+(\.\d+)?)/);
 if(r) return r[1]+"-"+r[2];

 let l = val.match(/(\d+\.?\d*)l-?(\d+)/);
 if(l) return l[1]+"l-"+l[2];

 return val;
}

// =========================
// ✅ CALCULS
// =========================
function calcAG(){
 let key=normalize(ag_input.value);
 let p=key.split("-");
 if(p.length!=2) return res_ag.innerText="Erreur";
 let res=(p[0]*5.35)+parseFloat(p[1]);
 res_ag.innerText="Résultat: "+res.toFixed(2);
}

function calcGC(){
 let v=parseFloat(gc_input.value);
 if(v) res_gc.innerText="Résultat: "+(v*7.35).toFixed(2);
}

function convert(){
 let v=parseFloat(conv_input.value);
 if(v) res_conv.innerText="≈ "+mmToConv(v);
}

// =========================
// ✅ BASE LESTAGE COMPLETE + TES AJOUTS
// =========================

const data={

// agricole
"14.9-24":{gal:49,lbs:409},
"16.9-28":{gal:72,lbs:575},
"18.4-38":{gal:110,lbs:917},

// gc / otr
"20.5-25":{gal:90,lbs:751},
"23.5-25":{gal:118,lbs:984},
"26.5-25":{gal:159,lbs:1326},
"29.5-25":{gal:207,lbs:1726},

// skid / industriel
"10-16.5":{gal:12,lbs:100},
"12-16.5":{gal:16,lbs:133},

// loader / l
"21l-24":{gal:87,lbs:726},
"19.5l-24":{gal:69,lbs:575},

// haute pression / spécial
"13.00-24":{gal:41,lbs:342},
"14.00-24":{gal:51,lbs:425},

// métrique direct
"340/80r18":{gal:27,lbs:225},
"500/70r24":{gal:70,lbs:583},
"540/70r24":{gal:84,lbs:701},
"400/80r24":{gal:53,lbs:442},
"250/75r16":{gal:10,lbs:83},
"250/80r16":{gal:12,lbs:100},

// compact loader
"12.5/80-18":{gal:27,lbs:225},
"14-17.5":{gal:22,lbs:184},
"15-19.5":{gal:30,lbs:270}

};

// =========================
// ✅ LESTAGE
// =========================

function lestage(){

 let key=normalize(lest_input.value);

 if(data[key]){
  let d=data[key];
  res_lest.innerText="💧 "+d.gal+" gal | ⚖️ "+d.lbs+" lbs ✅";
  return;
 }

 res_lest.innerText="❌ Non trouvé";
}

// =========================
// ✅ DIAMÈTRE
// =========================

function getDiameter(size){
 let val=normalize(size);
 let p=val.split("-");
 if(p.length!=2) return null;
 return (parseFloat(p[0])*0.85*2)+parseFloat(p[1]);
}

// =========================
// ✅ COMPARATEUR
// =========================

function comparePneus(){

 let d1=getDiameter(p1.value);
 let d2=getDiameter(p2.value);

 if(!d1||!d2){
  res_ratio.innerText="❌ Format invalide";
  return;
 }

 let diff=((d2-d1)/d1)*100;

 let verdict =
 Math.abs(diff)<=3?"✅ Compatible":
 Math.abs(diff)<=5?"⚠️ Limite":"❌ Incompatible";

 let color =
 Math.abs(diff)<=3?"lime":
 Math.abs(diff)<=5?"orange":"red";

 res_ratio.innerHTML=
 `<span style="color:${color}">
 Écart: ${diff.toFixed(1)}%<br>${verdict}
 </span>`;
}

// =========================
// ✅ RATIO AV / ARR
// =========================

function calcRatio(){

 let av=getDiameter(avant.value);
 let ar=getDiameter(arriere.value);

 if(!av||!ar){
  res_ratio.innerText="❌ Format invalide";
  return;
 }

 let ratio=av/ar;

 let verdict =
 (ratio>=0.97&&ratio<=1.03)?"✅ Parfait":
 (ratio>=0.95&&ratio<=1.05)?"⚠️ Acceptable":
 "❌ Danger transmission";

 let color =
 (ratio>=0.97&&ratio<=1.03)?"lime":
 (ratio>=0.95&&ratio<=1.05)?"orange":
 "red";

 res_ratio.innerHTML=
 `<span style="color:${color}">
 Ratio: ${ratio.toFixed(3)}<br>${verdict}
 </span>`;
}

// =========================
// ✅ RESET
// =========================

function resetAll(){
 p1.value="";p2.value="";
 avant.value="";arriere.value="";
 res_ratio.innerText="";
}

// =========================
// ✅ NAVIGATION
// =========================

function show(id,el){
 document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 el.classList.add("active");
}

</script>
